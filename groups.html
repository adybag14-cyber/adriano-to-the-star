<body>
    <main>
        <section class="page-hero" data-entrance="fadeIn">
            <h1 class="page-title" data-scroll-animate>Groups</h1>
            <p class="page-subtitle">Join Communities of Space Enthusiasts</p>
        </section>

        <section class="content-section" data-entrance="slideUp">
            <div class="content-container">
                <div class="section-header">
                    <h2>🌟 Available Groups</h2>
                    <div class="user-info">
                        <span class="user-display"></span>
                        <button class="login-button" onclick="showModal('login-modal')">Login</button>
                        <button class="logout-button" onclick="authManager.logout()" style="display: none;">Logout</button>
                    </div>
                </div>
                
                <div id="groups-list" class="groups-grid">
                    <div class="loading">Loading groups...</div>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="content-container">
                <div class="section-header">
                    <h2>📰 Groups Feed</h2>
                    <button id="create-post-btn" class="create-post-btn members-only" style="display: none;">✍ Create Post</button>
                </div>
                <div class="filter-buttons">
                    <button class="filter-group-btn active" data-group-id="">All Groups</button>
                </div>
                <div id="posts-container">
                    <div class="loading">Loading posts...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>🔐 Member Login</h2><button class="close-modal" onclick="hideModal('login-modal')">×</button></div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group"><label>Username or Email</label><input type="text" id="login-username" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="login-password" required></div>
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </div>

    <div id="register-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h2>📝 Create Account</h2><button class="close-modal" onclick="hideModal('register-modal')">×</button></div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group"><label>Username</label><input type="text" id="register-username" required></div>
                <div class="form-group"><label>Email</label><input type="email" id="register-email" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="register-password" required minlength="8"></div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>
