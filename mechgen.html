    <script>
        (function () {
            var frame = document.getElementById('mechgen-frame');
            var input = document.getElementById('mechgen-backend-url');
            var connectBtn = document.getElementById('mechgen-connect');
            var resetBtn = document.getElementById('mechgen-reset');

            function applyUrl(url) {
                if (!url) return;
                frame.src = url;
                if (input) input.value = url;
                localStorage.setItem('MECHGEN_WEB_URL', url);
            }

            connectBtn?.addEventListener('click', () => applyUrl(input.value));
            resetBtn?.addEventListener('click', () => {
                const def = 'http://localhost:8001/';
                applyUrl(def);
            });

            applyUrl(localStorage.getItem('MECHGEN_WEB_URL') || 'http://localhost:8001/');
        })();
    </script>
