    <style>
        html, body { height: 100%; margin: 0; background: #050505; }
        .mechgen-container { max-width: 1200px; margin: 0 auto; padding: 100px 20px 40px; }
        .mechgen-header { margin-bottom: 24px; text-align: center; }

        .mechgen-frame-container { position: relative; width: 100%; height: 850px; border: 1px solid rgba(103, 232, 249, 0.24); border-radius: 20px; overflow: hidden; background: rgba(0, 0, 0, 0.4); }
        .mechgen-frame { width: 100%; height: 100%; border: none; }
        .btn { padding: 12px 20px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.05); color: #fff; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn-primary { border-color: rgba(103, 232, 249, 0.55); background: rgba(103, 232, 249, 0.14); color: #67e8f9; }

        .mechgen-container :focus-visible { outline:3px solid #fff; outline-offset:3px; }

<body>
    <main id="main-content" class="mechgen-container" tabindex="-1">
        <div class="mechgen-header">
            <h1>MechGen</h1>
            <p>Advanced Organic Reaction Mechanism Synthesis & Visualization</p>
        </div>

        <div class="mechgen-controls" style="margin-bottom: 12px; display: flex; gap: 15px; align-items: center; justify-content: center;">
            <label for="mechgen-backend-url">Service URL</label>
            <input id="mechgen-backend-url" type="url" inputmode="url" placeholder="http://localhost:8001/" aria-describedby="mechgen-status" style="flex: 1; padding: 12px; border-radius: 10px; background: #000; border: 1px solid #67e8f9; color: #fff;">
            <button id="mechgen-connect" type="button" class="btn btn-primary">Connect this session</button>
            <button id="mechgen-reset" type="button" class="btn">Disconnect</button>
        </div>
        <p id="mechgen-status" role="status" aria-live="polite">No service is connected. The public site never starts a local or remote backend.</p>

        <div class="mechgen-frame-container">
            <iframe id="mechgen-frame" class="mechgen-frame" title="MechGen UI" sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin"></iframe>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; <span data-current-year></span> ADRIANO TO THE STAR - I.T.A (Interstellar Travel Agency)</p>
        <p><a href="index.html">Back to Home</a></p>
    </footer>

    <script>
        (function () {
            var frame = document.getElementById('mechgen-frame');
            var input = document.getElementById('mechgen-backend-url');
            var connectBtn = document.getElementById('mechgen-connect');
            var resetBtn = document.getElementById('mechgen-reset');
            var status = document.getElementById('mechgen-status');

            const emptyState = `<style>html{height:100%;background:#080a10;color:#d8dce6;font:16px/1.6 system-ui,sans-serif}section{min-height:100vh;display:grid;place-items:center;text-align:center}div{max-width:38rem;padding:2rem}h2{color:#67e8f9;letter-spacing:.08em}</style><section><div><h2>MechGen backend not connected</h2><p>Enter the URL of a running MechGen web service above and choose <strong>Connect</strong>. The public site does not assume a localhost service is available.</p></div></section>`;

            function showEmptyState() {
                frame.removeAttribute('src');
                frame.srcdoc = emptyState;
                status.textContent = 'No service is connected. The public site never starts a local or remote backend.';
            }

            function applyUrl(rawUrl) {
                const value = String(rawUrl || '').trim();
                if (!value) {
                    showEmptyState();
                    return;
                }
                let parsed;
                try {
                    parsed = new URL(value);
                } catch {
                    input?.setCustomValidity('Enter a valid http:// or https:// URL.');
                    input?.reportValidity();
                    return;
                }
                if (!['http:', 'https:'].includes(parsed.protocol)) {
                    input?.setCustomValidity('Only http:// and https:// URLs are supported.');
                    input?.reportValidity();
                    return;
                }
                const localHost = ['localhost', '127.0.0.1', '[::1]', '::1'].includes(parsed.hostname);
                if (parsed.protocol === 'http:' && !localHost) {
                    input?.setCustomValidity('Plain HTTP is allowed only for a loopback service. Use HTTPS for any remote service.');
                    input?.reportValidity();
                    return;
                }
                if (!localHost && !confirm(`Load the external MechGen service at ${parsed.origin} inside this sandboxed frame for this session?`)) return;
                input?.setCustomValidity('');
                frame.removeAttribute('srcdoc');
                frame.src = parsed.href;
                if (input) input.value = parsed.href;
                localStorage.setItem('MECHGEN_WEB_URL', parsed.href);
                status.textContent = `Connecting this session to ${parsed.origin}. The service has its own privacy and security boundary.`;
            }

            connectBtn?.addEventListener('click', () => applyUrl(input?.value));
            input?.addEventListener('input', () => input.setCustomValidity(''));
            resetBtn?.addEventListener('click', () => {
                localStorage.removeItem('MECHGEN_WEB_URL');
                if (input) input.value = '';
                showEmptyState();
            });

            const savedUrl = localStorage.getItem('MECHGEN_WEB_URL');
            if (savedUrl && input) input.value = savedUrl;
            showEmptyState();
        })();
    </script>
</body>
