<body>
    <main class="storage-page">
        <header class="storage-header">
            <div class="container">
                <h1>📁 Cloud Storage</h1>
                <p class="subtitle">1GB Free Storage Per Account</p>
            </div>
        </header>

        <div id="login-required-view" class="login-required-view">
            <div class="container">
                <div class="login-card">
                    <div class="login-icon">🔐</div>
                    <h2>Login Required</h2>
                    <p>Please log in to access your cloud storage.</p>
                    <button onclick="showModal('login-modal')" class="cta-button">Log In</button>
                </div>
            </div>
        </div>

        <div id="storage-dashboard" class="storage-dashboard" style="display: none;">
            <div class="container">
                <div class="storage-stats">
                    <div class="stat-card">
                        <div class="stat-icon">💾</div>
                        <div class="stat-info"><div class="stat-label">Used</div><div class="stat-value" id="storage-used">0 MB</div></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📊</div>
                        <div class="stat-info"><div class="stat-label">Limit</div><div class="stat-value">1 GB</div></div>
                    </div>
                </div>

                <div class="upload-section">
                    <h2>📤 Upload Files</h2>
                    <div class="upload-area" id="upload-area">
                        <p>Drag and drop or click to browse</p>
                        <input type="file" id="file-input" multiple style="display: none;">
                        <button id="browse-btn" class="cta-button">Browse Files</button>
                    </div>
                </div>

                <div class="files-section">
                    <h2>📂 Your Files</h2>
                    <div id="files-list" class="files-list"></div>
                </div>
            </div>
        </div>
    </main>
