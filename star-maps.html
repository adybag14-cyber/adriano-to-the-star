    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const init = () => {
                if (window.starMaps && typeof window.starMaps === 'function') {
                    const maps = window.starMaps();
                    if (maps && maps.createCanvas) maps.createCanvas('star-map-container');
                } else {
                    setTimeout(init, 500);
                }
            };
            init();
        });
    </script>
