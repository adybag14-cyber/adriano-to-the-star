name = "exoplanet-api-proxy"
main = "worker-api-proxy.js"
compatibility_date = "2024-01-08"

[vars]
API_BASE = "https://exoplanet-pioneer.pages.dev"

[[routes]]
pattern = "api.adrianotothestar.com/*"
