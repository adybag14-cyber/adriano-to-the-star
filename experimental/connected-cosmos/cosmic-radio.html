<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Radio | Browser Tab Waveform Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            margin: 0;
            background: #020611;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .radio-container {
            margin-top: 10vh;
            width: 80%;
            height: 60vh;
            background: #000;
            border: 2px solid #67e8f9;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(103, 232, 249, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            width: 80%;
            align-items: center;
        }
        .controls label { display: grid; gap: .4rem; flex: 1 1 180px; min-width:0; font-size:.85rem; }
        .controls input { width:100%; accent-color:#67e8f9; }
        #radio-pause { min-height:44px; padding:.7rem 1rem; background:#12283a; color:#e0faff; border:1px solid #64d4e2; border-radius:.7rem; }
        @media(max-width:600px){.radio-container{width:94%;height:45vh}.controls{width:94%}.radio-container h1{font-size:1rem}.status{top:55px;left:20px;right:10px}}

        .knob {
            width: 60px;
            height: 60px;
            background: #333;
            border-radius: 50%;
            border: 2px solid #555;
            cursor: pointer;
            position: relative;
        }

        .knob::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            width: 4px;
            height: 15px;
            background: #fbbf24;
            transform: translateX(-50%);
        }

        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fbbf24;
            font-size: 0.8rem;
        }

        h1 {
            position: absolute;
            top: 10px;
            left: 20px;
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }
    </style>
    <!-- MASTER MEGA-ENGINE ARCHITECTURE -->
    <script src="/universal-simulation-hub.js"></script>
    <script src="/void-warfare-engine.js"></script>
    <script src="/planetary-environment-engine.js"></script>
    <script src="/galactic-governance-engine.js"></script>
    <script src="/mining-resource-engine.js"></script>
    <script src="/xeno-intelligence-engine.js"></script>
    <script src="/quantum-propulsion-engine.js"></script>
    <script src="/intelligence-shadow-engine.js"></script>
    <script src="/fleet-command-mega-engine.js"></script>
    <script src="/deep-space-industry-engine.js"></script>
    <script src="/procedural-content-engine.js"></script>
    <script src="/galactic-commerce-engine.js"></script>
    <script src="/metaphysics-apotheosis-engine.js"></script>
</head>

<body>
    <a href="../../index.html" aria-label="Return home" style="position:fixed;right:16px;top:16px;z-index:20;width:44px;height:44px;">
        <img src="../../images/ita_logo.png" alt="" style="width:44px;height:44px;object-fit:contain;">
    </a>

    <a href="../../projects.html"
        style="position: absolute; top: 20px; left: 20px; color: #aaa; text-decoration: none; z-index: 10;">← BACK</a>

    <div class="radio-container">
        <h1>INTERSTELLAR RADIO</h1>
        <div class="status">SIGNAL: <span id="signal-strength">WAITING...</span></div>
        <canvas id="viz"></canvas>
    </div>

    <div class="controls">
        <label for="knob-freq">Wave frequency <output id="frequency-value">1.0</output>
            <input type="range" id="knob-freq" min="0.2" max="4" step="0.1" value="1" aria-label="Wave frequency">
        </label>
        <label for="knob-gain">Gain <output id="gain-value">1.0</output>
            <input type="range" id="knob-gain" min="0" max="2" step="0.1" value="1" aria-label="Signal gain">
        </label>
        <button id="radio-pause" type="button">Pause transmission</button>
    </div>

    <p style="color: #888; margin-top: 20px; max-width: 600px; text-align: center;">
        A simulated waveform shared through BroadcastChannel between tabs on this site. Open a second tab to receive its signal. This does not tune a physical radio or contact internet peers.
    </p>

    <script type="module">
        import { P2PManager } from './p2p-core.js';

        const canvas = document.getElementById('viz');
        const ctx = canvas.getContext('2d');
        const manager = new P2PManager();

        // Resize
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let dataPoints = new Array(100).fill(0);
        let paused = false;
        const frequency = document.getElementById('knob-freq');
        const gain = document.getElementById('knob-gain');
        frequency.addEventListener('input', () => { document.getElementById('frequency-value').textContent = Number(frequency.value).toFixed(1); });
        gain.addEventListener('input', () => { document.getElementById('gain-value').textContent = Number(gain.value).toFixed(1); });
        document.getElementById('radio-pause').addEventListener('click', event => {
            paused = !paused;
            event.currentTarget.textContent = paused ? 'Resume transmission' : 'Pause transmission';
            event.currentTarget.setAttribute('aria-pressed', String(paused));
            if (paused) document.getElementById('signal-strength').textContent = 'PAUSED';
        });

        // Viz Loop
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);

            for (let i = 0; i < dataPoints.length; i++) {
                const x = (i / dataPoints.length) * canvas.width;
                const y = (canvas.height / 2) + dataPoints[i] * 50 * Number(gain.value);
                ctx.lineTo(x, y);
            }

            ctx.strokeStyle = '#67e8f9';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(draw);
        }
        draw();

        // Listen for Radio waves
        manager.onRadioReceived = (nodeId, data) => {
            if (paused) return;
            document.getElementById('signal-strength').textContent = `RX: simulated waveform from ${nodeId}`;
            // Blend remote data with local visual
            if (Array.isArray(data)) {
                dataPoints = data;
            }
        };

        // Auto-broadcast noise for simulation
        setInterval(() => {
            if (paused || document.hidden) return;
            const freq = Number(frequency.value);
            const noise = new Array(100).fill(0).map((_, i) => Math.sin(i * 0.1 * freq + Date.now() / 100) * .8);

            manager.broadcastRadio(noise);

            // Visualize our own transmission if we are idle/broadcasting
            // (If we were receiving, we might want to show that instead, but for this demo, mixing is fine)
            if (document.getElementById('signal-strength').textContent.includes('WAITING') ||
                document.getElementById('signal-strength').textContent.includes('BROADCASTING') ||
                document.getElementById('signal-strength').textContent === 'PAUSED') {

                document.getElementById('signal-strength').textContent = 'TX: BROADCASTING';
                document.getElementById('signal-strength').style.color = '#67e8f9';
                dataPoints = noise;
            }
        }, 50); // 20Hz update

    </script>
</body>

</html>
