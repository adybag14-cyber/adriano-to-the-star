<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmospheric & Volumetric Engine | Adriano to the Stars</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: 'Inter', sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        .hud {
            position: fixed; top: 2rem; left: 2rem;
            background: rgba(0, 0, 0, 0.8); border: 1px solid #ba944f;
            padding: 2rem; border-radius: 12px; backdrop-filter: blur(15px);
            min-width: 350px; z-index: 100;
        }
        .roadmap-status {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
            margin-top: 1.5rem; font-size: 0.75rem; border-top: 1px solid rgba(186, 148, 79, 0.3);
            padding-top: 1rem;
        }
        .item-chip {
            background: rgba(186, 148, 79, 0.15); color: #ba944f;
            padding: 0.3rem 0.6rem; border-radius: 4px; border: 1px solid rgba(186, 148, 79, 0.3);
        }
        .control-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { width: 100%; accent-color: #ba944f; }
    </style>
    <!-- MASTER MEGA-ENGINE ARCHITECTURE -->
    <script src="universal-simulation-hub.js"></script>
    <script src="void-warfare-engine.js"></script>
    <script src="planetary-environment-engine.js"></script>
    <script src="galactic-governance-engine.js"></script>
    <script src="mining-resource-engine.js"></script>
    <script src="xeno-intelligence-engine.js"></script>
    <script src="quantum-propulsion-engine.js"></script>
    <script src="intelligence-shadow-engine.js"></script>
    <script src="fleet-command-mega-engine.js"></script>
    <script src="deep-space-industry-engine.js"></script>
    <script src="procedural-content-engine.js"></script>
    <script src="galactic-commerce-engine.js"></script>
    <script src="metaphysics-apotheosis-engine.js"></script>
</head>

<body>
    <canvas id="atmosphere-canvas"></canvas>

    <div class="hud">
        <h2 style="margin: 0 0 0.5rem 0; font-family: 'Orbitron'; letter-spacing: 3px; color: #ba944f;">VOLUMETRIC MASTER</h2>
        <p style="font-size: 0.85rem; opacity: 0.6; margin-bottom: 2rem;">Integrated Atmospheric & Weather System</p>

        <div class="control-group">
            <label>Cloud Density (Item #4)</label>
            <input type="range" id="cloud-density" min="0" max="1" step="0.01" value="0.5">
        </div>

        <div class="control-group">
            <label>Solar Scattering / God Rays (Item #35)</label>
            <input type="range" id="scattering" min="0" max="5" step="0.1" value="1.2">
        </div>

        <div class="control-group">
            <label>Aurora Intensity (Item #45)</label>
            <input type="range" id="aurora" min="0" max="1" step="0.01" value="0.3">
        </div>

        <div class="roadmap-status">
            <div class="item-chip">#4 Clouds</div>
            <div class="item-chip">#35 God Rays</div>
            <div class="item-chip">#45 Auroras</div>
            <div class="item-chip">#60 Lightning</div>
            <div class="item-chip">#94 Haze</div>
            <div class="item-chip">#105 Fog</div>
        </div>
    </div>

    <script type="module" src="atmosphere-sim.js"></script>
</body>

</html>
