<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volumetric Nebula Simulation (10M Particles) | Adriano to the Stars</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
    <style>
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ba944f;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            min-width: 280px;
            box-shadow: 0 0 30px rgba(186, 148, 79, 0.2);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        .stat-value {
            color: #ba944f;
            font-weight: 600;
        }

        .controls-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            border-top: 2px solid #ba944f;
            padding: 2rem;
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 15px 15px 0 0;
        }

        .roadmap-badge {
            background: #ba944f;
            color: #000;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .back-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(186, 148, 79, 0.3);
            border-color: #ba944f;
        }
    </style>
    <!-- MASTER MEGA-ENGINE ARCHITECTURE -->
    <script src="universal-simulation-hub.js"></script>
    <script src="void-warfare-engine.js"></script>
    <script src="planetary-environment-engine.js"></script>
    <script src="galactic-governance-engine.js"></script>
    <script src="mining-resource-engine.js"></script>
    <script src="xeno-intelligence-engine.js"></script>
    <script src="quantum-propulsion-engine.js"></script>
    <script src="intelligence-shadow-engine.js"></script>
    <script src="fleet-command-mega-engine.js"></script>
    <script src="deep-space-industry-engine.js"></script>
    <script src="procedural-content-engine.js"></script>
    <script src="galactic-commerce-engine.js"></script>
    <script src="metaphysics-apotheosis-engine.js"></script>
</head>

<body>
    <div id="canvas-container">
        <canvas id="nebula-canvas"></canvas>
    </div>

    <div class="ui-overlay">
        <div class="top-bar">
            <a href="../../projects.html" class="back-btn">← BACK</a>
            <div class="stats-panel">
                <div style="margin-bottom: 1rem; border-bottom: 1px solid rgba(186, 148, 79, 0.3); padding-bottom: 0.5rem;">
                    <span class="roadmap-badge">ITEM #1</span>
                    <h3 style="display: inline; margin: 0; font-size: 1rem; font-family: 'Orbitron';">Omniverse Engine</h3>
                </div>
                <div class="stat-row"><span>Particles</span> <span class="stat-value">10,000,000</span></div>
                <div class="stat-row"><span>Solver</span> <span class="stat-value">Navier-Stokes (Compute)</span></div>
                <div class="stat-row"><span>GPU Load</span> <span class="stat-value" id="gpu-load">0%</span></div>
                <div class="stat-row"><span>Frame Time</span> <span class="stat-value" id="frame-time">0ms</span></div>
            </div>
        </div>

        <div class="controls-panel">
            <h4 style="margin: 0 0 1.5rem 0; font-family: 'Orbitron'; color: #ba944f; letter-spacing: 2px;">NEBULA FLUID DYNAMICS</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    <label style="font-size: 0.8rem; opacity: 0.7;">Viscosity</label>
                    <input type="range" id="viscosity" min="0" max="1" step="0.01" value="0.1" style="width: 100%;">
                </div>
                <div>
                    <label style="font-size: 0.8rem; opacity: 0.7;">Vorticity</label>
                    <input type="range" id="vorticity" min="0" max="5" step="0.1" value="2.0" style="width: 100%;">
                </div>
            </div>
            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.75rem; opacity: 0.5;">
                WebGPU | 10M Particles | Real-time Fluid Simulation
            </div>
        </div>
    </div>

    <script type="module" src="nebula-sim.js"></script>
</body>

</html>
