<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Particle Study | Adriano To The Star</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../projects.css">
    <style>
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stats-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ba944f;
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(20px);
            min-width: 280px;
            box-shadow: 0 0 30px rgba(186, 148, 79, 0.2);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
        }

        .stat-value {
            color: #ba944f;
            font-weight: 600;
        }

        .controls-panel {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.85);
            border-top: 2px solid #ba944f;
            padding: 2rem;
            backdrop-filter: blur(20px);
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 15px 15px 0 0;
        }

        .roadmap-badge {
            background: #ba944f;
            color: #000;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        .back-btn {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: rgba(186, 148, 79, 0.3);
            border-color: #ba944f;
        }
        .stats-panel { border-color: #62ddec; box-shadow: 0 0 30px #35b4d522; }
        .stat-value, .controls-panel h4 { color: #91eeff !important; }
        .controls-panel { border-color: #62ddec; }
        #pause-nebula { min-height: 44px; background:#122939; color:#e1faff; border:1px solid #65c3d4; border-radius:8px; padding:8px 14px; }
        @media (max-width: 650px) {
            .ui-overlay { padding:12px; overflow:auto; gap:16px; }
            .top-bar { gap:12px; flex-direction:column; }
            .stats-panel { min-width:0; width:100%; padding:12px; }
            .controls-panel { padding:16px; }
        }
    </style>
    <!-- MASTER MEGA-ENGINE ARCHITECTURE -->
    <script src="/universal-simulation-hub.js"></script>
    <script src="/void-warfare-engine.js"></script>
    <script src="/planetary-environment-engine.js"></script>
    <script src="/galactic-governance-engine.js"></script>
    <script src="/mining-resource-engine.js"></script>
    <script src="/xeno-intelligence-engine.js"></script>
    <script src="/quantum-propulsion-engine.js"></script>
    <script src="/intelligence-shadow-engine.js"></script>
    <script src="/fleet-command-mega-engine.js"></script>
    <script src="/deep-space-industry-engine.js"></script>
    <script src="/procedural-content-engine.js"></script>
    <script src="/galactic-commerce-engine.js"></script>
    <script src="/metaphysics-apotheosis-engine.js"></script>
</head>

<body>
    <main id="canvas-container" aria-label="Interactive nebula particle study">
        <canvas id="nebula-canvas" aria-label="Nebula particle animation"></canvas>
    </main>

    <div class="ui-overlay">
        <div class="top-bar">
            <a href="../../projects.html" class="back-btn">← BACK</a>
            <div class="stats-panel">
                <div style="margin-bottom: 1rem; border-bottom: 1px solid rgba(186, 148, 79, 0.3); padding-bottom: 0.5rem;">
                    <h1 style="display: inline; margin: 0; font-size: 1rem; font-family: 'Orbitron';">Nebula Particle Study</h1>
                </div>
                <div class="stat-row"><span>Particles</span> <span class="stat-value" id="particle-count">Initializing</span></div>
                <div class="stat-row"><span>Model</span> <span class="stat-value">Vortex advection</span></div>
                <div class="stat-row"><span>Renderer</span> <span class="stat-value" id="gpu-load">Checking support</span></div>
                <div class="stat-row"><span>Frame Time</span> <span class="stat-value" id="frame-time">0ms</span></div>
            </div>
        </div>

        <div class="controls-panel">
            <h4 style="margin: 0 0 1.5rem 0; font-family: 'Orbitron'; color: #ba944f; letter-spacing: 2px;">NEBULA FLUID DYNAMICS</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div>
                    <label for="viscosity" style="font-size: 0.8rem; opacity: 0.9;">Viscosity</label>
                    <input type="range" id="viscosity" min="0" max="1" step="0.01" value="0.1" style="width: 100%;">
                </div>
                <div>
                    <label for="vorticity" style="font-size: 0.8rem; opacity: 0.9;">Vorticity</label>
                    <input type="range" id="vorticity" min="0" max="5" step="0.1" value="2.0" style="width: 100%;">
                </div>
            </div>
            <p id="nebula-status" role="status">Starting the particle study…</p>
            <button id="pause-nebula" type="button" aria-pressed="false">Pause simulation</button>
        </div>
    </div>

    <script type="module" src="nebula-sim.js"></script>
</body>

</html>
