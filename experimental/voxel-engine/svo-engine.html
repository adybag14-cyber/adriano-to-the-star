<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Billion Voxel SVO Engine | Adriano to the Stars</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            overflow: hidden;
            background: #000;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        .svo-ui {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #ba944f;
            border-radius: 8px;
            padding: 1.5rem;
            z-index: 100;
            backdrop-filter: blur(10px);
            min-width: 300px;
        }

        .roadmap-badge {
            background: #ba944f;
            color: #000;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 900;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-value {
            color: #ba944f;
        }
    </style>
    <!-- MASTER MEGA-ENGINE ARCHITECTURE -->
    <script src="universal-simulation-hub.js"></script>
    <script src="void-warfare-engine.js"></script>
    <script src="planetary-environment-engine.js"></script>
    <script src="galactic-governance-engine.js"></script>
    <script src="mining-resource-engine.js"></script>
    <script src="xeno-intelligence-engine.js"></script>
    <script src="quantum-propulsion-engine.js"></script>
    <script src="intelligence-shadow-engine.js"></script>
    <script src="fleet-command-mega-engine.js"></script>
    <script src="deep-space-industry-engine.js"></script>
    <script src="procedural-content-engine.js"></script>
    <script src="galactic-commerce-engine.js"></script>
    <script src="metaphysics-apotheosis-engine.js"></script>
</head>

<body>
    <canvas id="svo-canvas"></canvas>

    <div class="svo-ui">
        <span class="roadmap-badge">ITEM #2: SVO ENGINE</span>
        <h3 style="margin: 0 0 1rem 0; font-family: 'Orbitron'; font-size: 1rem;">Recursive Octree Simulation</h3>
        
        <div class="stat-line">
            <span>Potential Voxels</span>
            <span class="stat-value">1,073,741,824</span>
        </div>
        <div class="stat-line">
            <span>Octree Depth</span>
            <span class="stat-value">10 Levels</span>
        </div>
        <div class="stat-line">
            <span>Renderer</span>
            <span class="stat-value">WebGPU Ray-Marcher</span>
        </div>
        <div class="stat-line">
            <span>Frame Time</span>
            <span id="frame-time" class="stat-value">0ms</span>
        </div>

        <div style="margin-top: 1.5rem; font-size: 0.7rem; opacity: 0.5; line-height: 1.4;">
            Implementing recursive traversal of a sparse voxel octree for planet-scale detail simulation.
        </div>
    </div>

    <script type="module" src="svo-engine.js"></script>
</body>

</html>
