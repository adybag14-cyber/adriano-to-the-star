<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Telemetry | Native Integration</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at 80% 10%,rgba(124,58,237,.16),transparent 32rem),#020611;
            color: #a5f3fc;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(103,232,249,.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .terminal {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .line {
            margin-bottom: 5px;
            word-break: break-all;
        }

        .line.tx {
            color: #fbbf24;
        }

        .line.sys {
            color: #fff;
        }

        .input-area {
            padding: 10px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            color: #a5f3fc;
            padding: 10px;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg,#0891b2,#6366f1);
            color: #fff;
            border: 1px solid rgba(103,232,249,.35);
            padding: 10px 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 90%);
        }
        button.secondary{background:rgba(8,47,73,.65)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}.header-actions{display:flex;align-items:center;gap:.6rem}.terminal{scrollbar-color:#38bdf8 transparent}
        .home-logo{position:fixed;right:1rem;bottom:1rem;z-index:5;width:auto}.home-logo .ita-logo{position:static;width:40px;height:40px;object-fit:contain}
        @media(max-width:720px){.header{align-items:stretch;gap:1rem;flex-direction:column}.header-actions{display:grid;grid-template-columns:1fr 1fr}.header-actions a{grid-column:1 / -1}.input-area{padding:.7rem;flex-wrap:wrap}.input-area input{min-width:0}.terminal{padding:12px}}
        @media(prefers-reduced-motion:reduce){.crt-overlay{display:none}}
    </style>
</head>

<body>
    <a href="../../index.html" class="home-logo" aria-label="Return to Adriano To The Star home">
        <img src="../../images/ita_logo.png" alt="ITA Logo" class="ita-logo">
    </a>
    <div class="header">
        <div>
            <h1 style="margin:0; font-size:1.5rem">HARDWARE TELEMETRY LINK</h1>
            <span id="connection-status" role="status" aria-live="polite">DISCONNECTED</span>
        </div>
        <div class="header-actions">
            <a href="../../projects.html" style="color: #4af626; text-decoration: none; margin-right: 20px;">[EXIT]</a>
            <button type="button" id="simulate-btn" class="secondary">START SIMULATION</button>
            <button type="button" id="connect-btn">CONNECT DEVICE</button>
        </div>
    </div>

    <div class="terminal" id="terminal" role="log" aria-live="polite" aria-relevant="additions">
        <div class="line sys">SYSTEM READY...</div>
        <div class="line sys">WAITING FOR SERIAL CONNECTION...</div>
    </div>
    <div class="crt-overlay"></div>

    <div class="input-area">
        <label for="cmd-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Telemetry command</label>
        <input type="text" id="cmd-input" placeholder="Enter command…" disabled>
        <button type="button" id="send-btn" disabled>SEND</button>
    </div>

    <script type="module">
        import { NativeBridge } from './native-core.js';

        const bridge = new NativeBridge();
        const term = document.getElementById('terminal');
        const connectBtn = document.getElementById('connect-btn');
        const simulateBtn = document.getElementById('simulate-btn');
        const sendBtn = document.getElementById('send-btn');
        const input = document.getElementById('cmd-input');
        const status = document.getElementById('connection-status');

        let decoder = new TextDecoder();
        let simulationInterval = null;

        function log(msg, type = '') {
            const div = document.createElement('div');
            div.className = `line ${type}`;
            div.textContent = msg;
            term.appendChild(div);
            while (term.children.length > 220) term.firstElementChild?.remove();
            term.scrollTop = term.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            if (bridge.port) {
                await bridge.disconnectSerial();
                connectBtn.textContent = 'CONNECT DEVICE';
                status.textContent = 'DISCONNECTED';
                input.disabled = true;
                sendBtn.disabled = true;
                simulateBtn.disabled = false;
                log('CONNECTION TERMINATED.', 'sys');
                return;
            }

            try {
                // Try Real Connection
                await bridge.connectSerial(9600);

                status.textContent = 'CONNECTED (9600 BAUD)';
                connectBtn.textContent = 'DISCONNECT';
                input.disabled = false;
                sendBtn.disabled = false;
                simulateBtn.disabled = true;
                log('SERIAL PORT OPENED.', 'sys');

                // Handle Incoming Data
                bridge.onSerialData = (chunk) => {
                    const text = decoder.decode(chunk);
                    log(text);
                };

            } catch (e) {
                if (e.name === 'NotFoundError') log('DEVICE SELECTION CANCELLED. NO CONNECTION WAS OPENED.', 'sys');
                else log('ERROR: ' + e.message, 'sys');
            }
        });

        function startSimulation() {
            if (bridge.port) {
                log('DISCONNECT THE SERIAL DEVICE BEFORE STARTING SIMULATION.', 'sys');
                return;
            }
            if (simulationInterval) {
                clearInterval(simulationInterval);
                simulationInterval = null;
                simulateBtn.textContent = 'START SIMULATION';
                status.textContent = 'DISCONNECTED';
                input.disabled = true;
                sendBtn.disabled = true;
                connectBtn.disabled = !bridge.supportsSerial;
                log('SIMULATION ENDED.', 'sys');
                return;
            }
            log('STARTING BROWSER-LOCAL SIMULATION MODE…', 'sys');
            status.textContent = 'SIMULATION';
            simulateBtn.textContent = 'STOP SIMULATION';
            input.disabled = false;
            sendBtn.disabled = false;
            connectBtn.disabled = true;

            simulationInterval = setInterval(() => {
                const temp = (Math.random() * 5 + 20).toFixed(2);
                const pressure = (Math.random() * 10 + 100).toFixed(2);
                log(`[TELEMETRY] TEMP: ${temp}C | PRESS: ${pressure}kPa`);
            }, 1000);
        }

        simulateBtn.addEventListener('click', startSimulation);

        sendBtn.addEventListener('click', sendCommand);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); sendCommand(); }
        });

        async function sendCommand() {
            const text = input.value;
            if (!text) return;

            log(`> ${text}`, 'tx');
            if (bridge.port) {
                await bridge.sendSerial(text + '\n');
            }
            input.value = '';
        }

        // Check API
        if (!bridge.supportsSerial) {
            log('WARNING: WebSerial API not supported. Only simulation mode available.', 'sys');
            connectBtn.disabled = true;
            connectBtn.textContent = 'DEVICE API UNAVAILABLE';
        }
    </script>
</body>

</html>
