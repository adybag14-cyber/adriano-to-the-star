<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captain's Log | Native Integration</title>
    <link rel="stylesheet" href="../../styles.css">
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at 15% 15%,rgba(14,165,233,.14),transparent 32rem),#020611;
            color: #dbeafe;
            font-family: 'Fira Code', monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .toolbar {
            background: rgba(3,10,24,.95);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid rgba(103,232,249,.22);
            align-items: center;
        }

        .btn {
            background: rgba(8,47,73,.62);
            color: #e0f2fe;
            border: 1px solid rgba(103,232,249,.32);
            padding: 8px 15px;
            cursor: pointer;
            font-family: inherit;
            border-radius: 2px;
        }

        .btn:hover {
            background: #505050;
        }

        .btn-primary {
            background: linear-gradient(135deg,#0891b2,#6366f1);
            color: white;
            border-color: #007acc;
        }

        .btn-primary:hover {
            background: #0062a3;
        }

        .status-bar {
            background: linear-gradient(90deg,#0e7490,#4f46e5);
            color: white;
            padding: 2px 10px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        textarea {
            flex: 1;
            background: rgba(2,6,17,.92);
            color: #e2e8f0;
            border: none;
            padding: 20px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        .filename {
            color: #fff;
            font-weight: bold;
            margin-right: 20px;
        }
        .support-note{margin-left:auto;color:#a5f3fc;font-size:.72rem}.btn:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #67e8f9;outline-offset:3px}.btn:disabled{opacity:.45;cursor:not-allowed}
        @media(max-width:700px){.toolbar{flex-wrap:wrap;padding:10px}.filename{width:100%;order:2}.support-note{width:100%;margin:0;order:3}textarea{padding:14px}.status-bar{gap:.5rem;flex-wrap:wrap}}
    </style>
</head>

<body>
    <div class="toolbar">
        <a href="../../projects.html" style="text-decoration: none; color: #aaa; margin-right: 20px;">← EXIT</a>
        <span class="filename" id="current-file">Untitled.txt</span>
        <button type="button" class="btn" id="open-btn">Open File…</button>
        <button type="button" class="btn btn-primary" id="save-btn">Save</button>
        <button type="button" class="btn" id="save-as-btn">Save As…</button>
        <span class="support-note" id="support-note">Detecting file access…</span>
    </div>

    <textarea id="editor" aria-label="Captain's log editor" spellcheck="false" placeholder="// Begin entry, Captain...
// This text editor can read and write directly to your local file system."></textarea>

    <div class="status-bar">
        <span id="status-msg" role="status" aria-live="polite">Ready</span>
        <span>Col <span id="col-count">1</span>, Ln <span id="ln-count">1</span></span>
    </div>

    <script type="module">
        import { NativeBridge } from './native-core.js';

        const bridge = new NativeBridge();
        const editor = document.getElementById('editor');
        const statusMsg = document.getElementById('status-msg');
        const filenameEl = document.getElementById('current-file');
        const supportNote = document.getElementById('support-note');
        const draftKey = 'ita-captains-log-draft';
        let saveTimer = null;

        // Editor Stats
        editor.addEventListener('input', updateStats);
        editor.addEventListener('click', updateStats);
        editor.addEventListener('keyup', updateStats);

        function updateStats() {
            const val = editor.value.substring(0, editor.selectionStart);
            const lines = val.split('\n');
            document.getElementById('ln-count').textContent = lines.length;
            document.getElementById('col-count').textContent = lines[lines.length - 1].length + 1;
            statusMsg.textContent = 'Unsaved changes';
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try { localStorage.setItem(draftKey, editor.value); statusMsg.textContent = 'Draft saved in this browser'; } catch { statusMsg.textContent = 'Draft is not persisted'; }
            }, 350);
        }

        // Open
        document.getElementById('open-btn').addEventListener('click', async () => {
            try {
                const file = await bridge.openFile();
                editor.value = file.content;
                filenameEl.textContent = file.name;
                statusMsg.textContent = 'File loaded';
            } catch (e) {
                if (e.name !== 'AbortError') alert(e.message);
            }
        });

        // Save
        document.getElementById('save-btn').addEventListener('click', async () => {
            try {
                if (!bridge.supportsFileSystem) {
                    localStorage.setItem(draftKey, editor.value);
                    statusMsg.textContent = 'Draft saved in this browser';
                    return;
                }
                const name = await bridge.saveFile(editor.value, false);
                filenameEl.textContent = name;
                statusMsg.textContent = 'Saved successfully';
            } catch (e) {
                if (e.name !== 'AbortError') alert(e.message);
            }
        });

        // Save As
        document.getElementById('save-as-btn').addEventListener('click', async () => {
            try {
                const name = await bridge.saveFile(editor.value, true);
                filenameEl.textContent = name;
                statusMsg.textContent = 'Saved successfully';
            } catch (e) {
                if (e.name !== 'AbortError') alert(e.message);
            }
        });

        // Check support without triggering a permission prompt.
        if (!bridge.supportsFileSystem) {
            supportNote.textContent = 'Browser draft mode';
            document.getElementById('open-btn').disabled = true;
            document.getElementById('save-as-btn').disabled = true;
            let savedDraft = '';
            try { savedDraft = localStorage.getItem(draftKey) || ''; } catch { savedDraft = ''; }
            if (savedDraft) editor.value = savedDraft;
            document.getElementById('save-btn').textContent = 'Save browser draft';
            statusMsg.textContent = 'File System API unavailable; editor remains in local draft mode';
        } else {
            supportNote.textContent = 'File access available on explicit request';
        }
    </script>
</body>

</html>
