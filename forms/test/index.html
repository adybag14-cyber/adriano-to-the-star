<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form - Adriano To The Star</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="../../images/ita_logo.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #050811;
            --panel: rgba(8, 14, 30, 0.84);
            --panel-strong: rgba(13, 21, 42, 0.94);
            --text: #f7fbff;
            --muted: #a9b8ca;
            --line: rgba(255, 255, 255, 0.16);
            --accent: #61d6ff;
            --accent-2: #f2c96d;
            --bad: #ff7b8b;
            --good: #7ee0a3;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                linear-gradient(90deg, rgba(5, 8, 17, 0.9), rgba(5, 8, 17, 0.62)),
                url("../../images/bg-large.jpg") center / cover fixed,
                var(--bg);
        }

        main {
            display: grid;
            min-height: 100vh;
            place-items: center;
            padding: 32px 16px;
        }

        .form-shell {
            width: min(720px, 100%);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(18px);
            overflow: hidden;
        }

        .form-header {
            display: grid;
            gap: 8px;
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--line);
            background: var(--panel-strong);
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-row img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.55rem, 4vw, 2.35rem);
            line-height: 1.08;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 0;
            max-width: 60ch;
            color: var(--muted);
            line-height: 1.55;
        }

        form {
            display: grid;
            gap: 18px;
            padding: 28px;
        }

        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        label {
            display: grid;
            gap: 8px;
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.4;
        }

        input,
        select,
        textarea {
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(1, 6, 18, 0.78);
            color: var(--text);
            font: inherit;
            letter-spacing: 0;
            padding: 12px 13px;
            outline: none;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(97, 214, 255, 0.16);
        }

        .honeypot {
            position: absolute;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        .checkbox-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--muted);
            line-height: 1.45;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            min-height: 18px;
            margin-top: 2px;
            accent-color: var(--accent);
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        button {
            min-height: 46px;
            border: 0;
            border-radius: 6px;
            background: var(--accent);
            color: #04101c;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            letter-spacing: 0;
            padding: 0 18px;
        }

        button:hover {
            background: #8de4ff;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        .status {
            min-height: 24px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .status[data-kind="success"] {
            color: var(--good);
        }

        .status[data-kind="error"] {
            color: var(--bad);
        }

        .back-link {
            color: var(--accent-2);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            main {
                padding: 16px;
            }

            .form-header,
            form {
                padding: 22px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                align-items: stretch;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main>
        <section class="form-shell" aria-labelledby="form-title">
            <div class="form-header">
                <div class="brand-row">
                    <img src="../../images/ita_logo.png" alt="">
                    <h1 id="form-title">Adriano To The Star Test Form</h1>
                </div>
                <p class="subtitle">Messages submitted here are sent to the site owner inbox for Worker email testing.</p>
            </div>

            <form id="test-form">
                <div class="grid">
                    <label>
                        Name
                        <input name="name" autocomplete="name" maxlength="120" required>
                    </label>
                    <label>
                        Email
                        <input name="email" type="email" autocomplete="email" maxlength="254" required>
                    </label>
                </div>

                <label>
                    Topic
                    <select name="topic">
                        <option value="General test">General test</option>
                        <option value="Website feedback">Website feedback</option>
                        <option value="Booking enquiry">Booking enquiry</option>
                        <option value="Technical issue">Technical issue</option>
                    </select>
                </label>

                <label>
                    Message
                    <textarea name="message" maxlength="4000" required></textarea>
                </label>

                <label class="honeypot" aria-hidden="true">
                    Company
                    <input name="company" tabindex="-1" autocomplete="off">
                </label>

                <label class="checkbox-row">
                    <input name="consent" type="checkbox" required>
                    <span>I want to send this test message to adybag14@gmail.com.</span>
                </label>

                <div class="actions">
                    <a class="back-link" href="../../index.html">Back to site</a>
                    <button id="submit-button" type="submit">Send Test Message</button>
                </div>
                <output id="form-status" class="status" role="status" aria-live="polite"></output>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('test-form');
        const statusEl = document.getElementById('form-status');
        const submitButton = document.getElementById('submit-button');

        function endpointForCurrentHost() {
            const host = window.location.hostname;
            if (window.location.protocol === 'file:' || host === 'localhost' || host === '127.0.0.1') {
                return 'http://127.0.0.1:8787/api/test-form';
            }
            return '/api/test-form';
        }

        function setStatus(message, kind) {
            statusEl.textContent = message;
            statusEl.dataset.kind = kind || '';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            setStatus('Sending...', '');
            submitButton.disabled = true;

            const payload = Object.fromEntries(new FormData(form).entries());
            payload.consent = form.elements.consent.checked;
            payload.page = window.location.href;
            payload.submittedAt = new Date().toISOString();

            try {
                const response = await fetch(endpointForCurrentHost(), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const result = await response.json().catch(() => ({}));

                if (!response.ok || !result.success) {
                    throw new Error(result.error || 'The message could not be sent.');
                }

                form.reset();
                setStatus('Sent. Check the inbox for the test message.', 'success');
            } catch (error) {
                setStatus(error.message || 'The message could not be sent.', 'error');
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
