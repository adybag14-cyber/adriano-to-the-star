name: GitLab Mirror Heavy Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pioneer-heavy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pioneer-build:
    name: Windows Pages build + unit gates
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Set up Python for offline catalogue verification
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Current-tree credential gate
        run: |
          node scripts/check-current-tree-secrets.mjs --self-test
          node scripts/check-current-tree-secrets.mjs --root .

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: JavaScript syntax gates
        run: |
          node --check exoplanet-pioneer.js
          node --check planet-generator.js
          node --check local-system-view.js
          node --check pioneer-raytracing.js
          node --check pioneer-runtime.js
          node --check pioneer-cinematic-renderer.js
          node --check pioneer-universe-streaming.js
          node --check universe-manager.js
          node --check space-combat.js
          node --check performance-system.js
          node --check experimental/webgpu-galaxy/nebula-sim.js
          node --check scripts/minify-pioneer-pages.mjs
          node --check scripts/site-pages.mjs
          node --check scripts/prepare-production-pages.mjs
          node --check scripts/audit-production-pages.mjs
          node --check scripts/check-current-tree-secrets.mjs
          node --check projects.js
          node --check ita-universe-shell.js
          node --check navigation.js
          node --check theme-toggle.js
          node --check cosmic-music-player.js
          node --check interactive-star-maps.js
          node --check education-bootstrap.js
          node --check sky-math.js
          node --check education-sky.js
          node --check observatory-catalog.js
          node --check observatory-experience.js
          node --check scripts/capture-observatory.mjs
          node --check playwright.observatory.config.mjs
          node --check education-viewer.js
          node --check education-software-renderer.js
          node --check education-software-worker.js
          node --check flight-field-worker.js
          node --check experimental/webgpu-galaxy/galaxy-sim.js
          node --check experimental/webgpu-galaxy/galaxy-software-worker.js
          node --check tests/e2e/rendering-repair.spec.js
          node --check experimental/procedural-planets/forge-v5.js
          node --check experimental/procedural-planets/forge-terrain.js
          node --check experimental/procedural-planets/forge-shaders.js
          node --check experimental/fluid-nebula/nebula-v5.js
          node --check experimental/fluid-nebula/nebula-cpu-worker.js
          node --check experimental/fluid-nebula/nebula-shaders.js
          node --check database-previews.js
          node --check planet-preview-worker.js
          node --check site-header.js
          node --check scripts/shared-site-header.mjs
          node --check tests/e2e/forge-v5.spec.js
          node --check renderer-capabilities.js
          node --check tests/e2e/helpers/lab-functional-profile.js
          node --check planetary-appearance-model.js
          node --check atmosphere-catalog.js
          node --check scripts/update-exoplanet-atmospheres.mjs
          node --check scripts/build-exoplanet-appearance-index.mjs
          node --check scripts/pioneer-playwright-workload.mjs
          node --check scripts/pioneer-workload-fixtures.mjs
          node --check scripts/pioneer-workload-render-profile.mjs
          node --check scripts/pioneer-advanced-rendering-smoke.mjs
          node --check tests/e2e/smoke-functional.spec.js
          node --check tests/e2e/smoke-ci.spec.js
          node --check tests/e2e/site-overhaul.spec.js
          node --check tests/e2e/local-platform-remediation.spec.js
          node --check tests/e2e/privacy-tracker.spec.js
          node --check tests/e2e/pioneer-star-maps-advanced.spec.js
          node --check tests/e2e/education-atmosphere-models.spec.js
          node --check tests/e2e/accessibility-all-pages.spec.js
          node --check tests/e2e/site-action-contracts.spec.js
          node --check tests/e2e/site-shared-actions.spec.js
          node --check tests/e2e/pioneer-runtime-v2.spec.js
          node --check tests/e2e/pioneer-workload-render-profile.spec.js
          node --check tests/e2e/pioneer-mobile-commands.spec.js
          node --check tests/e2e/pioneer-universe-streaming.spec.js
          node --check tests/e2e/pioneer-cinematic-combat.spec.js
          node --check tests/e2e/site-repair-review.spec.js
          node --check tests/e2e/bonsai-loader.spec.js
          node --check tests/e2e/games-archive-contracts.spec.js
          node --check tests/e2e/pioneer-science-deck.spec.js
          node --check tests/e2e/database-lazy-loader.spec.js
          node --check tests/e2e/helpers/pioneer-functional-profile.js

      - name: Repository lint gate
        run: npm run lint -- --quiet

      - name: Zero-vulnerability dependency gate
        run: npm audit --audit-level=low

      - name: Jest regression suite with coverage
        run: npm run test:coverage -- --runInBand

      - name: Blocking exoplanet science and provenance gates
        run: |
          npm run test:engine
          npm run validate:engine
          npm run test:observatory:science

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage-${{ github.run_id }}
          path: coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Resolve canonical GitLab SHA
        shell: pwsh
        run: |
          $canonical = (Get-Content .gitlab-source-sha -Raw).Trim()
          if ($canonical -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid .gitlab-source-sha: $canonical"
          }
          $manifest = Get-Content .github-ci-snapshot.json -Raw | ConvertFrom-Json
          if ($manifest.source -ne 'gitlab.com/adybag14-group/starisdons') {
            throw "Unexpected canonical source: $($manifest.source)"
          }
          if ($manifest.sourceSha -ne $canonical) {
            throw "Snapshot manifest source SHA does not match .gitlab-source-sha."
          }
          "CI_COMMIT_SHA=$canonical" >> $env:GITHUB_ENV
          "CI_COMMIT_SHORT_SHA=$($canonical.Substring(0, 8))" >> $env:GITHUB_ENV
          "GITLAB_SOURCE_SHA=$canonical" >> $env:GITHUB_ENV

      - name: Build exact GitLab Pages artifact
        shell: pwsh
        run: ./build-pages.ps1

      - name: Audit all production pages and search metadata
        run: npm run audit:site

      - name: Verify bundled startup artifact
        shell: pwsh
        run: |
          $html = Get-Content public/exoplanet-pioneer.html -Raw
          $generated = [regex]::Matches($html, 'src="[^"]*\.pioneer\.(?:bundle\.)?min\.js\?v=')
          if ($generated.Count -ne 5) {
            throw "Expected 5 generated Pioneer startup scripts, found $($generated.Count)."
          }
          if ($html -notmatch 'pioneer-foundation\.pioneer\.bundle\.min\.js' -or
              $html -notmatch 'pioneer-systems\.pioneer\.bundle\.min\.js') {
            throw 'Pioneer startup bundles are missing from the Pages artifact.'
          }
          if ($html -notmatch [regex]::Escape("?v=$env:CI_COMMIT_SHORT_SHA")) {
            throw "Pages artifact is not stamped with canonical GitLab SHA $env:CI_COMMIT_SHORT_SHA."
          }

      - name: Upload exact Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: pioneer-pages-${{ github.run_id }}
          path: public
          if-no-files-found: error
          retention-days: 2

  site-production-smoke:
    name: Linux Chromium production artifact smoke (${{ matrix.shard }}/3)
    needs: pioneer-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download Windows-built Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pioneer-pages-${{ github.run_id }}
          path: public

      - name: Production artifact browser, control, localization and Axe suite
        shell: bash
        env:
          BASE_URL: http://127.0.0.1:8095
          # Functional hit-testing uses a real, bounded software framebuffer.
          # The independent advanced-graphics gate retains the full render profile.
          PIONEER_FUNCTIONAL_RENDER_PROFILE: software
          # All V5 effects still execute. Only the dedicated lab test's physical
          # framebuffer is bounded for CPU-only SwiftShader. Native GPU output
          # has independent full-resolution evidence.
          LAB_FUNCTIONAL_DPR: '0.25'
        run: |
          python3 -m http.server 8095 --bind 127.0.0.1 --directory public > /tmp/adriano-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$BASE_URL/index.html" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/adriano-smoke-server.log
            exit 1
          fi
          # Keep all existing preflight gates once; distribute the unchanged
          # complete suite across independent runners, never skip test files.
          if [ "${{ matrix.shard }}" = "1" ]; then
            npx playwright test tests/e2e/rendering-repair.spec.js --workers=1 --reporter=line
            npx playwright test tests/e2e/exoplanet-engine.spec.js --workers=1 --reporter=line
            npx playwright test tests/e2e/exoplanet-loading-budget.spec.js --workers=1 --reporter=line
            npx playwright test tests/e2e/site-overhaul.spec.js --grep 'reduced.motion' --workers=1 --reporter=line
            npx playwright test tests/e2e/forge-v5.spec.js tests/e2e/smoke-ci.spec.js --workers=1 --reporter=line
            npx playwright test tests/e2e/site-action-contracts.spec.js --grep 'every atmospheric world' --workers=1 --reporter=line
            npx playwright test tests/e2e/site-overhaul.spec.js --grep 'all ten project labs' --workers=1 --reporter=line
          fi
          npx playwright test \
            tests/e2e/smoke-ci.spec.js \
            tests/e2e/site-overhaul.spec.js \
            tests/e2e/rendering-repair.spec.js \
            tests/e2e/forge-v5.spec.js \
            tests/e2e/education-textures.spec.js \
            tests/e2e/education-hd-toggle.spec.js \
            tests/e2e/local-platform-remediation.spec.js \
            tests/e2e/privacy-tracker.spec.js \
            tests/e2e/pioneer-star-maps-advanced.spec.js \
            tests/e2e/education-atmosphere-models.spec.js \
            tests/e2e/accessibility-all-pages.spec.js \
            tests/e2e/site-action-contracts.spec.js \
            tests/e2e/site-shared-actions.spec.js \
            tests/e2e/pioneer-runtime-v2.spec.js \
            tests/e2e/pioneer-workload-render-profile.spec.js \
            tests/e2e/pioneer-mobile-commands.spec.js \
            tests/e2e/pioneer-universe-streaming.spec.js \
            tests/e2e/pioneer-cinematic-combat.spec.js \
            tests/e2e/site-repair-review.spec.js \
            tests/e2e/bonsai-loader.spec.js \
            tests/e2e/games-archive-contracts.spec.js \
            tests/e2e/pioneer-science-deck.spec.js \
            tests/e2e/database-lazy-loader.spec.js \
            --workers=1 \
            --shard=${{ matrix.shard }}/3 \
            --reporter=line,blob

      - name: Upload production artifact smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-artifact-smoke-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
            blob-report/
          if-no-files-found: warn
          retention-days: 14

  site-production-smoke-gate:
    name: Linux Chromium production artifact smoke
    needs: site-production-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every retained-suite shard
        env:
          SHARD_RESULT: ${{ needs.site-production-smoke.result }}
        run: test "$SHARD_RESULT" = success

  pioneer-browser:
    name: Linux Chromium gameplay workload
    needs: pioneer-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download Windows-built Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pioneer-pages-${{ github.run_id }}
          path: public

      - name: Full Pioneer browser workload
        run: node scripts/pioneer-playwright-workload.mjs --headless=true --min-headless-fps=1 --ci-render-profile=low --run-id=github-actions-pioneer


      - name: Upload Pioneer workload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pioneer-heavy-validation-${{ github.run_id }}
          path: .devbox/logs/pioneer-github-actions-pioneer
          if-no-files-found: warn
          retention-days: 14

  pioneer-advanced:
    name: Linux Chromium advanced graphics smoke
    needs: pioneer-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out GitHub mirror
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download Windows-built Pages artifact
        uses: actions/download-artifact@v8
        with:
          name: pioneer-pages-${{ github.run_id }}
          path: public

      - name: Advanced graphics and local-system smoke
        run: node scripts/pioneer-advanced-rendering-smoke.mjs

  observatory-visual-evidence:
    name: Observatory desktop/mobile + PNG/GIF gallery
    needs: pioneer-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm ci --prefer-offline --no-audit
          npx playwright install --with-deps chromium
      - name: Install GIF encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Download the same Windows-built production artifact
        uses: actions/download-artifact@v8
        with:
          name: pioneer-pages-${{ github.run_id }}
          path: public
      - name: Browser regressions and all-page visual evidence
        shell: bash
        env:
          OBS_BASE_URL: http://127.0.0.1:8097
        run: |
          python3 -m http.server 8097 --bind 127.0.0.1 --directory public > /tmp/observatory-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$OBS_BASE_URL/index.html" > /dev/null; then break; fi
            sleep 1
          done
          status=0
          npm run test:observatory:browser || status=$?
          # Capture still runs after a test failure, so regressions have images.
          node scripts/capture-observatory.mjs --base-url "$OBS_BASE_URL" --all-pages || status=$?
          cp /tmp/observatory-http.log .artifacts/observatory/http-server.log
          exit "$status"
      - name: Upload browsable PNG/GIF gallery, metrics and failure traces
        if: always()
        id: gallery
        uses: actions/upload-artifact@v7
        with:
          name: observatory-visual-evidence-${{ github.run_id }}
          path: |
            .artifacts/observatory/
            !.artifacts/observatory/**/frames/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
      - name: Link evidence from the Actions summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.gallery.outputs.artifact-url }}
        run: |
          echo '## Observatory visual review' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download screenshots, animated GIFs, HTML gallery, metrics and failure traces]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unzip and open candidate/index.html. The GIFs play at 5 fps for review; independent frame samples and renderer information are in candidate/metrics.json.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job exercises the exact Windows-built artifact. It does not deploy or write to production.' >> "$GITHUB_STEP_SUMMARY"
