name: Read-only production visual audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'

permissions:
  contents: read

concurrency:
  group: observatory-production-read-only
  cancel-in-progress: true

jobs:
  public-website-evidence:
    name: Production pages, frame samples and GIF gallery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install browser and GIF encoder
        run: |
          npm ci --prefer-offline --no-audit
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Read-only public website audit
        run: node scripts/capture-observatory.mjs --production --all-pages
      - name: Upload production evidence even when a page fails
        if: always()
        id: evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-visual-audit-${{ github.run_id }}
          path: |
            .artifacts/observatory/production/
            !.artifacts/observatory/production/frames/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
      - name: Link the review gallery
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          echo '## Production visual audit' >> "$GITHUB_STEP_SUMMARY"
          echo "[Download HTML gallery, PNGs, GIFs and raw metrics]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Unzip and open index.html. This is a fresh unauthenticated browser restricted to GET/HEAD/OPTIONS; no forms, claims, purchases or production writes are submitted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Asset versions and measurement conditions are recorded in metrics.json. GIF playback rate is not measured rendering FPS.' >> "$GITHUB_STEP_SUMMARY"
