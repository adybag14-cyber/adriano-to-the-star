<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brotli2 Benchmark Test</title>
    <style>
        body {
            font-family: monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        h1 {
            color: #00ff00;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
        }
        .results {
            background: #0a0a0a;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #00ff00;
        }
        .status {
            color: #ffff00;
            margin-bottom: 10px;
        }
        pre {
            background: #0a0a0a;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Brotli2 Benchmark Test</h1>
    <div class="status" id="status">Loading...</div>
    <div class="results" id="results"></div>

    <!-- Load Brotli2 prototype -->
    <script src="brotli2-prototype.js"></script>
    <script src="brotli2-benchmark.js"></script>

    <script>
        document.getElementById('status').textContent = 'Loading...';

        // Run benchmarks when page loads
        window.addEventListener('load', async () => {
            try {
                document.getElementById('status').textContent = 'Initializing benchmark...';
                
                // Wait a bit for scripts to load
                await new Promise(resolve => setTimeout(resolve, 100));
                
                const benchmark = new Brotli2Benchmark();
                window.brotli2Benchmark = benchmark;
                
                document.getElementById('status').textContent = 'Running benchmarks...';
                await benchmark.runBenchmarks();
                
                document.getElementById('status').textContent = '✓ Benchmarks completed';
                console.log('[Benchmark] All tests completed successfully');
            } catch (error) {
                document.getElementById('status').textContent = '✗ Error: ' + error.message;
                console.error('[Benchmark] Error:', error);
                console.error('[Benchmark] Stack:', error.stack);
            }
        });
    </script>
</body>
</html>
