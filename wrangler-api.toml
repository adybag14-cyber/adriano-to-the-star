name = "exoplanet-api-proxy"
main = "worker-api.js"
compatibility_date = "2026-07-31"
workers_dev = true

[[routes]]
pattern = "api.adrianotothestar.com/*"
zone_name = "adrianotothestar.com"

[[d1_databases]]
binding = "DB"
database_name = "exoplanet-pioneer-db"
database_id = "cd07e612-6190-4921-b538-bc88c6774519"
migrations_dir = "migrations/d1"

[vars]
API_BACKEND = "cloudflare-d1"
